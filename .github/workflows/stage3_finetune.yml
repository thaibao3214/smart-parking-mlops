name: Smart Parking - Stage 3 v1 Checkpoint Fine-Tune

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-parking-stage3-finetune
  cancel-in-progress: false

jobs:
  stage3:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_SLUG: nguynngthibo/smart-parking-stage-three-finetune-probe

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install DVC and Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'dvc[s3]==3.67.1' 'kaggle==2.2.5' 'six>=1.16' Pillow
          echo 'STAGE3_DEPS_PASS'

      - name: Download versioned PKLot data using DVC
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess
          token = os.environ.get('DAGSHUB_TOKEN', '').strip()
          if not token or any(ord(ch) < 33 or ord(ch) == 127 for ch in token):
              raise SystemExit('Missing or malformed DAGSHUB_TOKEN')
          for key in ('access_key_id', 'secret_access_key'):
              subprocess.run(['dvc','remote','modify','--local','origin',key,token],check=True)
          print('STAGE3_DVC_AUTH_PASS')
          PY
          dvc pull data.dvc -r origin --jobs 4
          test -f mobilenet_model/mobilenet_v3_small_best.pth.dvc || {
            echo 'Missing DVC pointer for MobileNetV3 v1; see Stage 3 setup instructions'
            exit 1
          }
          dvc pull mobilenet_model/mobilenet_v3_small_best.pth.dvc -r origin
          test -s mobilenet_model/mobilenet_v3_small_best.pth
          echo 'STAGE3_V1_CHECKPOINT_DVC_PULL_PASS'
          echo 'STAGE3_DVC_PULL_PASS'

      - name: Prepare 128 train and 64 validation crops
        shell: bash
        run: |
          set -euo pipefail
          python pipeline/prepare_stage2.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('.stage2_dataset/manifest.json').read_text(encoding='utf-8'))
          assert manifest['github_run_id'] == os.environ['GITHUB_RUN_ID']
          assert manifest['git_commit'] == os.environ['GITHUB_SHA']
          assert len(manifest['train']) == 128 and len(manifest['valid']) == 64
          assert manifest['online_crops_included'] == 0
          assert manifest['test_crops_included'] == 0
          for split in ('train', 'valid'):
              for record in manifest[split]:
                  assert (Path('.stage2_dataset') / record['file']).is_file()
          print('STAGE3_PREP_PASS')
          print('STAGE3_NO_TEST_LEAKAGE_PASS')
          PY

      - name: Package crops and prepare unique dataset metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, shutil, zipfile
          from pathlib import Path

          root = Path('.stage2_dataset')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          dataset_name = f"smart-parking-stage3-r{os.environ['GITHUB_RUN_ID']}-a{os.environ['GITHUB_RUN_ATTEMPT']}"
          dataset_slug = 'nguynngthibo/' + dataset_name
          metadata = {
              'title': dataset_name,
              'id': dataset_slug,
              'licenses': [{'name': 'unknown'}],
          }
          (root / 'dataset-metadata.json').write_text(json.dumps(metadata, indent=2), encoding='utf-8')
          (Path(os.environ['GITHUB_ENV'])).open('a', encoding='utf-8').write(
              f'DATASET_SLUG={dataset_slug}\nDATASET_NAME={dataset_name}\n'
          )

          import hashlib
          checkpoint = Path('mobilenet_model/mobilenet_v3_small_best.pth')
          assert checkpoint.is_file(), 'Missing original v1 state_dict'
          h = hashlib.sha256()
          with checkpoint.open('rb') as fp:
              for chunk in iter(lambda: fp.read(1024 * 1024), b''):
                  h.update(chunk)
          manifest['v1_checkpoint_sha256'] = h.hexdigest()
          manifest['stage'] = 'stage3-finetune'
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          records = manifest['train'] + manifest['valid']
          names = [r['file'] for r in records]
          assert len(names) == len(set(names)) == 192
          archive = root / 'payload.zip'
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as z:
              for filename in names:
                  relative = Path(filename)
                  assert not relative.is_absolute() and '..' not in relative.parts
                  assert relative.parts[0] in ('train','valid')
                  z.write(root / relative, arcname=relative.as_posix())
              z.write(checkpoint, arcname='checkpoint/mobilenet_v3_small_best.pth')
          with zipfile.ZipFile(archive) as z:
              assert set(z.namelist()) == set(names + ['checkpoint/mobilenet_v3_small_best.pth'])
              assert z.testzip() is None
          shutil.rmtree(root / 'train')
          shutil.rmtree(root / 'valid')
          print('STAGE3_ZIP_PASS: 192 images + v1 checkpoint')
          print('DATASET_SLUG:', dataset_slug)
          PY

      - name: Create new private Kaggle dataset for this run
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN" || { echo 'Missing KAGGLE_API_TOKEN'; exit 1; }
          kaggle datasets create -p .stage2_dataset
          echo 'STAGE3_DATASET_CREATE_SUBMITTED'
          ready=0
          for i in $(seq 1 60); do
            if status=$(kaggle datasets status "$DATASET_SLUG" 2>&1); then
              echo "Dataset status [$i]: $status"
              if [[ "$status" == *ready* ]]; then ready=1; break; fi
              if [[ "$status" == *error* || "$status" == *failed* ]]; then exit 1; fi
            else
              echo "Dataset not queryable yet (attempt $i)"
            fi
            sleep 10
          done
          if [[ "$ready" -ne 1 ]]; then echo 'Dataset readiness timeout'; exit 1; fi
          echo 'STAGE3_DATASET_READY_PASS'

      - name: Build Kaggle GPU job attached to unique dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .stage2_kernel stage3_logs
          python - <<'PY'
          import json, os
          from pathlib import Path
          source = Path('kaggle/stage3_finetune.py').read_text(encoding='utf-8')
          marker = '__STAGE3_DATASET_NAME__'
          if source.count(marker) != 1:
              raise SystemExit('stage3_finetune.py must contain exactly one dataset name marker')
          source = source.replace(marker, os.environ['DATASET_NAME'])
          run_marker = '__EXPECTED_RUN_ID__'
          if source.count(run_marker) != 1:
              raise SystemExit('Expected exactly one GitHub run marker')
          source = source.replace(run_marker, os.environ['GITHUB_RUN_ID'])
          (Path('.stage2_kernel') / 'train.py').write_text(source, encoding='utf-8')

          meta = {
              'id': os.environ['KERNEL_SLUG'],
              'title': 'smart-parking-stage-three-finetune-probe',
              'code_file': 'train.py',
              'language': 'python',
              'kernel_type': 'script',
              'is_private': True,
              'enable_gpu': True,
              'enable_internet': False,
              'machine_shape': 'NvidiaTeslaT4',
              'dataset_sources': [os.environ['DATASET_SLUG']],
              'kernel_sources': [],
              'competition_sources': [],
              'model_sources': [],
          }
          (Path('.stage2_kernel') / 'kernel-metadata.json').write_text(
              json.dumps(meta, indent=2), encoding='utf-8'
          )
          print('STAGE3_KERNEL_METADATA_PASS:', meta['dataset_sources'])
          PY
          python -m py_compile .stage2_kernel/train.py
          echo 'STAGE3_SCRIPT_SYNTAX_PASS'

      - name: Start Kaggle GPU training
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p .stage2_kernel
          echo 'STAGE3_KAGGLE_PUSH_PASS'
          echo 'PRODUCTION_UNCHANGED' 

      - name: Wait for Kaggle job completion
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p stage3_logs
          for i in $(seq 1 150); do
            if ! status=$(kaggle kernels status "$KERNEL_SLUG" 2>&1); then
              echo "$status"
              echo 'STATUS_API_ERROR' > stage3_logs/status.txt
              exit 0
            fi
            echo "[$i] $status"
            if [[ "$status" == *COMPLETE* ]]; then echo 'COMPLETE' > stage3_logs/status.txt; exit 0; fi
            if [[ "$status" == *ERROR* || "$status" == *FAILED* || "$status" == *CANCEL* ]]; then
              echo 'ERROR' > stage3_logs/status.txt
              exit 0
            fi
            sleep 12
          done
          echo 'TIMEOUT' > stage3_logs/status.txt

      - name: Collect Kaggle logs and report even on error
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p stage3_logs
          if command -v kaggle >/dev/null 2>&1 && [[ -n "${KAGGLE_API_TOKEN:-}" ]]; then
            for i in $(seq 1 5); do
              if kaggle kernels output "$KERNEL_SLUG" -p stage3_logs; then break; fi
              sleep 8
            done
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('stage3_logs').glob('*.log'):
              raw = path.read_text(encoding='utf-8', errors='replace')
              try:
                  records = json.loads(raw)
                  raw = ''.join(part.get('data', '') for part in records)
              except (ValueError, TypeError):
                  pass
              print('==== KAGGLE OUTPUT ====')
              print(raw[-14000:])
          PY

      - name: Verify exact input version and completed GPU training
        shell: bash
        run: |
          set -euo pipefail
          status=$(cat stage3_logs/status.txt)
          echo "FINAL_KERNEL_STATUS: $status"
          test "$status" = COMPLETE || { echo 'STAGE3_GPU_TRAIN_FAIL'; exit 1; }
          python - <<'PY'
          import json, os
          from pathlib import Path
          reports = list(Path('stage3_logs').rglob('stage3_report.json'))
          if not reports:
              raise SystemExit('Missing stage3_report.json')
          result = json.loads(reports[0].read_text(encoding='utf-8'))
          expected = json.loads(Path('.stage2_dataset/manifest.json').read_text(encoding='utf-8'))
          assert result['stage'] == 'stage3-finetune'
          assert result['github_run_id'] == os.environ['GITHUB_RUN_ID'], 'Kaggle used stale dataset version'
          assert result['git_commit'] == os.environ['GITHUB_SHA'], 'Git commit mismatch'
          assert result['data_dvc_sha256'] == expected['data_dvc_sha256'], 'DVC pointer mismatch'
          assert result['train_samples'] == 128 and result['valid_samples'] == 64
          assert result['weights'] == 'v1_checkpoint'
          assert result['online_crops_included'] == 0
          assert result['test_crops_included'] == 0
          assert result['v1_checkpoint_sha256'] == expected['v1_checkpoint_sha256']
          assert result['production_approved'] is False
          assert result['gpu']
          print('STAGE3_FINETUNE_GPU_PASS')
          print('STAGE3_FINETUNE_END_TO_END_PASS')
          print('GPU:', result['gpu'])
          print('BASELINE_VALID_ACCURACY:', result['baseline_valid_accuracy'])
          print('CANDIDATE_VALID_ACCURACY:', result['candidate_valid_accuracy'])
          PY

      - name: Upload Stage 3 logs and manifests
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: smart-parking-stage3-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            stage3_logs/
            .stage2_dataset/manifest.json
            .stage2_dataset/dataset-metadata.json
            .stage2_kernel/kernel-metadata.json
          if-no-files-found: warn
          retention-days: 14
