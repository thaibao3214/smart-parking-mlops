
name: Smart Parking - Stage 1 DVC Data Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-parking-dvc-stage1
  cancel-in-progress: false

jobs:
  validate-dvc:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}

    steps:
      - name: Checkout exact Git commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install DVC S3 support
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install 'dvc[s3]==3.67.1' PyYAML

          dvc version

      - name: Configure DagsHub DVC credentials
        shell: bash
        run: |
          set -euo pipefail

          test -f data.dvc || {
            echo "ERROR: data.dvc missing"
            exit 1
          }

          test -f .dvc/config || {
            echo "ERROR: .dvc/config missing"
            exit 1
          }

          python - <<'PY'
          import os
          import subprocess

          token = os.environ.get("DAGSHUB_TOKEN", "").strip()

          if not token:
              raise SystemExit(
                  "ERROR: GitHub Actions secret DAGSHUB_TOKEN is missing"
              )

          if any(ord(c) < 33 or ord(c) == 127 for c in token):
              raise SystemExit(
                  "ERROR: DAGSHUB_TOKEN contains invalid control characters"
              )

          subprocess.run(
              [
                  "dvc",
                  "remote",
                  "modify",
                  "--local",
                  "origin",
                  "access_key_id",
                  token,
              ],
              check=True,
          )

          subprocess.run(
              [
                  "dvc",
                  "remote",
                  "modify",
                  "--local",
                  "origin",
                  "secret_access_key",
                  token,
              ],
              check=True,
          )

          print("DVC_CREDENTIALS_CONFIGURED")
          PY

      - name: Pull versioned data directly from DagsHub
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking available disk space"
          df -h .

          echo "Pulling DVC data from DagsHub"

          dvc pull data.dvc -r origin --jobs 4

          echo "DVC_PULL_PASS"

      - name: Validate COCO splits and prevent test leakage
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p outputs/dvc_stage1

          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          import yaml

          root = Path.cwd()
          data_dvc = root / "data.dvc"

          pointer = yaml.safe_load(
              data_dvc.read_text(encoding="utf-8")
          )

          outs = pointer.get("outs", [])

          if not outs:
              raise SystemExit(
                  "FAIL: data.dvc has no tracked outputs"
              )

          result = {
              "timestamp_utc": datetime.now(
                  timezone.utc
              ).isoformat(),
              "git_commit": os.environ["GITHUB_SHA"],
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "data_dvc_sha256": hashlib.sha256(
                  data_dvc.read_bytes()
              ).hexdigest(),
              "dvc_outputs": [
                  {
                      "path": item.get("path"),
                      "md5": item.get("md5"),
                      "size": item.get("size"),
                      "nfiles": item.get("nfiles"),
                  }
                  for item in outs
              ],
              "splits": {},
              "online": {},
              "training_approved": False,
          }

          # Validate original COCO datasets
          for split in ("train", "valid", "test"):
              base = root / "data" / split

              annotation_path = (
                  base / "_annotations.coco.json"
              )

              if not annotation_path.is_file():
                  raise SystemExit(
                      f"FAIL: missing {annotation_path}"
                  )

              with annotation_path.open(
                  encoding="utf-8"
              ) as f:
                  coco = json.load(f)

              images = coco.get("images", [])
              annotations = coco.get(
                  "annotations", []
              )

              if not images or not annotations:
                  raise SystemExit(
                      f"FAIL: empty COCO split {split}"
                  )

              missing = sum(
                  not (
                      base /
                      Path(image["file_name"]).name
                  ).is_file()
                  for image in images
              )

              if missing:
                  raise SystemExit(
                      f"FAIL: {split} has "
                      f"{missing} missing images"
                  )

              image_ids = {
                  image["id"]
                  for image in images
              }

              orphan = sum(
                  ann.get("image_id") not in image_ids
                  for ann in annotations
              )

              if orphan:
                  raise SystemExit(
                      f"FAIL: {split} has "
                      f"{orphan} orphan annotations"
                  )

              result["splits"][split] = {
                  "images": len(images),
                  "annotations": len(annotations),
                  "missing_files": 0,
              }

              print(
                  f"{split}: "
                  f"{len(images)} images, "
                  f"{len(annotations)} annotations, "
                  f"0 missing files"
              )

          # Inspect online confirmed data
          online_root = (
              root / "data" /
              "confirmed_online" / "frames"
          )

          label_files = (
              sorted(online_root.glob("*/labels.json"))
              if online_root.exists()
              else []
          )

          crop_count = 0
          corrections = 0
          sources = set()

          for label_path in label_files:
              online_data = json.loads(
                  label_path.read_text(
                      encoding="utf-8"
                  )
              )

              source_name = Path(
                  online_data.get("source_image")
                  or ""
              ).name

              if source_name:
                  sources.add(source_name)

              for slot in online_data.get(
                  "slots", []
              ):
                  crop_name = slot.get(
                      "crop_file", ""
                  )

                  if (
                      not crop_name
                      or Path(crop_name).name != crop_name
                      or not (
                          label_path.parent / crop_name
                      ).is_file()
                  ):
                      raise SystemExit(
                          "FAIL: invalid online crop "
                          f"in {label_path}"
                      )

                  crop_count += 1

                  if (
                      slot.get("predicted_label")
                      != slot.get("confirmed_label")
                  ):
                      corrections += 1

          # Check overlap with original test images
          test_path = (
              root / "data" / "test" /
              "_annotations.coco.json"
          )

          test_coco = json.loads(
              test_path.read_text(
                  encoding="utf-8"
              )
          )

          test_names = {
              Path(image["file_name"]).name
              for image in test_coco["images"]
          }

          overlaps = len(
              sources.intersection(test_names)
          )

          result["online"] = {
              "frames": len(label_files),
              "crops": crop_count,
              "corrections": corrections,
              "source_frames_overlapping_test": overlaps,
          }

          # Filename checks alone cannot establish
          # that online training data is independent.
          result["training_approved"] = False

          if overlaps:
              print(
                  "SAFETY_GATE: "
                  f"{overlaps} online source frames "
                  "overlap PKLot test"
              )
              print(
                  "Do not train on these crops "
                  "while using the same test split "
                  "for unbiased evaluation"
              )
          else:
              print(
                  "SAFETY_GATE: no filename overlap "
                  "detected; provenance review "
                  "is still required"
              )

          output_path = (
              root / "outputs" /
              "dvc_stage1" / "manifest.json"
          )

          output_path.write_text(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          print("DVC_STAGE1_PASS")
          print("MANIFEST:", output_path)
          PY

      - name: Upload validation manifest
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dvc-stage1-manifest-${{ github.run_id }}
          path: outputs/dvc_stage1/manifest.json
          if-no-files-found: warn
          retention-days: 14
