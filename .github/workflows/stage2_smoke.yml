name: Smart Parking - Stage 2 GPU Training Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-parking-stage2-smoke
  cancel-in-progress: false

jobs:
  stage2:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      DATASET_SLUG: nguynngthibo/smart-parking-stage2-smoke
      KERNEL_SLUG: nguynngthibo/smart-parking-stage-two-training-probe

    steps:
      - name: Checkout GitHub
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install DVC and Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'dvc[s3]==3.67.1' 'kaggle==2.2.5' 'six>=1.16' Pillow
          python -c 'import dvc, kaggle, six; print("STAGE2_DEPS_PASS")'

      - name: Retrieve exactly versioned PKLot from DagsHub
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess
          token = os.environ.get('DAGSHUB_TOKEN', '').strip()
          if not token or any(ord(c) < 33 or ord(c) == 127 for c in token):
              raise SystemExit('Missing/invalid DAGSHUB_TOKEN')
          for key in ('access_key_id', 'secret_access_key'):
              subprocess.run(['dvc', 'remote', 'modify', '--local', 'origin', key, token], check=True)
          print('STAGE2_DVC_AUTH_PASS')
          PY
          df -h .
          dvc pull data.dvc -r origin --jobs 4
          echo 'STAGE2_DVC_PULL_PASS'

      - name: Build safe tiny train and validation samples
        shell: bash
        run: |
          set -euo pipefail
          python pipeline/prepare_stage2.py
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('.stage2_dataset/manifest.json').read_text())
          assert d['online_crops_included'] == 0 and d['test_crops_included'] == 0
          print('STAGE2_NO_TEST_LEAKAGE_PASS')
          PY

      - name: Create or update separate PRIVATE Kaggle dataset
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN" || { echo 'Missing KAGGLE_API_TOKEN'; exit 1; }
          if kaggle datasets status "$DATASET_SLUG" >/dev/null 2>&1; then
            kaggle datasets version -p .stage2_dataset -m "Stage2 smoke $GITHUB_RUN_ID"
          else
            kaggle datasets create -p .stage2_dataset
          fi
          for i in $(seq 1 48); do
            status=$(kaggle datasets status "$DATASET_SLUG" 2>&1) || { echo "$status"; exit 1; }
            echo "Dataset status: $status"
            if [[ "$status" == *ready* ]]; then break; fi
            if [[ "$i" -eq 48 ]]; then echo 'Dataset readiness timeout'; exit 1; fi
            sleep 10
          done

      - name: Prepare Kaggle GPU script and metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .stage2_kernel stage2_logs
          cp kaggle/stage2_smoke.py .stage2_kernel/train.py
          python -m py_compile .stage2_kernel/train.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          meta = {
              'id': os.environ['KERNEL_SLUG'],
              'title': 'Smart Parking Stage Two Training Probe',
              'code_file': 'train.py',
              'language': 'python',
              'kernel_type': 'script',
              'is_private': True,
              'enable_gpu': True,
              'enable_internet': False,
              'machine_shape': 'NvidiaTeslaT4',
              'dataset_sources': [os.environ['DATASET_SLUG']],
              'kernel_sources': [], 'competition_sources': [], 'model_sources': [],
          }
          Path('.stage2_kernel/kernel-metadata.json').write_text(json.dumps(meta, indent=2), encoding='utf-8')
          print('STAGE2_KERNEL_METADATA_PASS')
          PY

      - name: Start Kaggle GPU training
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p .stage2_kernel
          echo 'STAGE2_KAGGLE_PUSH_PASS'

      - name: Poll Kaggle status
        shell: bash
        run: |
          set -uo pipefail
          for i in $(seq 1 150); do
            status=$(kaggle kernels status "$KERNEL_SLUG" 2>&1)
            code=$?
            echo "[$i] $status"
            if [[ "$code" -ne 0 ]]; then
              echo 'STATUS_API_ERROR' > stage2_logs/status.txt
              exit 0
            fi
            if [[ "$status" == *COMPLETE* ]]; then
              echo 'COMPLETE' > stage2_logs/status.txt
              exit 0
            fi
            if [[ "$status" == *ERROR* || "$status" == *FAILED* || "$status" == *CANCEL* ]]; then
              echo 'ERROR' > stage2_logs/status.txt
              exit 0
            fi
            sleep 12
          done
          echo 'TIMEOUT' > stage2_logs/status.txt

      - name: Always collect Kaggle logs and outputs
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p stage2_logs
          if command -v kaggle >/dev/null 2>&1 && [[ -n "${KAGGLE_API_TOKEN:-}" ]]; then
            kaggle kernels output "$KERNEL_SLUG" -p stage2_logs || echo 'KAGGLE_LOG_DOWNLOAD_FAILED'
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('stage2_logs').glob('*.log'):
              raw = p.read_text(encoding='utf-8', errors='replace')
              try:
                  records = json.loads(raw)
                  raw = ''.join(rec.get('data', '') for rec in records)
              except (ValueError, TypeError):
                  pass
              print('==== KAGGLE LOG ====')
              print(raw[-12000:])
          PY

      - name: Verify an actual GPU training step completed
        shell: bash
        run: |
          set -euo pipefail
          status=$(cat stage2_logs/status.txt)
          echo "FINAL_KERNEL_STATUS: $status"
          test "$status" = 'COMPLETE' || { echo 'STAGE2_GPU_TRAIN_FAIL'; exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path
          reports = list(Path('stage2_logs').rglob('stage2_report.json'))
          assert reports, 'Missing GPU training report'
          report = json.loads(reports[0].read_text(encoding='utf-8'))
          assert report['stage'] == 'stage2-smoke'
          assert report['train_samples'] == 128 and report['valid_samples'] == 64
          assert report['production_approved'] is False
          print('STAGE2_END_TO_END_PASS')
          print('GPU:', report['gpu'])
          print('Validation accuracy (smoke only):', report['valid_accuracy'])
          PY

      - name: Upload Stage 2 diagnostic artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: smart-parking-stage2-${{ github.run_id }}
          path: |
            stage2_logs/
            .stage2_dataset/manifest.json
            .stage2_kernel/kernel-metadata.json
          if-no-files-found: warn
          retention-days: 14
