name: Smart Parking - Stage 7 Continuous Training (review only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'approved_online.dvc'

permissions:
  contents: read

concurrency:
  group: smart-parking-stage7-ct
  cancel-in-progress: false

jobs:
  continuous-training:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      DAGSHUB_USERNAME: thaibao3214
      DAGSHUB_REPO: smart-parking-mlops
      KERNEL_SLUG: nguynngthibo/smart-parking-stage7-continuous-training
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install GitHub-side dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'dvc[s3]==3.67.1' 'kaggle==2.2.5' 'mlflow==2.22.2' 'Pillow>=10,<12' 'six>=1.16'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1' 'torchvision==0.20.1'
          python -m py_compile pipeline/stage7_prepare.py pipeline/stage7_gate.py kaggle/stage7_train.py
          echo STAGE7_DEPS_PASS

      - name: DVC pull approved new crops, PKLot validation and 3 baseline checkpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess
          token = os.environ.get('DAGSHUB_TOKEN', '').strip()
          if not token or any(ord(c)<33 or ord(c)==127 for c in token):
              raise SystemExit('Missing/malformed DAGSHUB_TOKEN')
          for k in ('access_key_id', 'secret_access_key'):
              subprocess.run(['dvc', 'remote', 'modify', '--local', 'origin', k, token], check=True)
          PY
          test -s approved_online.dvc || {
            echo 'No approved online DVC pointer. Follow README_STAGE7.md before starting.'
            exit 1
          }
          dvc pull approved_online.dvc -r origin --jobs 4
          dvc pull data.dvc -r origin --jobs 4
          for pointer in \
            mobilenet_model/mobilenet_v3_small_best.pth.dvc \
            resnet_model/resnet18_best.pth.dvc \
            cnn_model/optimized_custom_cnn_best.pth.dvc
          do
            dvc pull "$pointer" -r origin
          done
          test -s approved_online/manifest.json
          test -s data/valid/_annotations.coco.json
          echo STAGE7_DVC_PULL_PASS

      - name: Validate human approval and package exact versioned data
        shell: bash
        run: |
          set -euo pipefail
          python pipeline/stage7_prepare.py --approved-dir approved_online \
            --valid-dir data/valid --min-per-class 16 --valid-per-class 128
          python - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('.stage7_dataset/manifest.json').read_text(encoding='utf-8'))
          if m['github_run_id'] != os.environ['GITHUB_RUN_ID'] or m['git_commit'] != os.environ['GITHUB_SHA']:
              raise SystemExit('Wrong GitHub run metadata')
          n = m['dataset_name']
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              out.write(f'DATASET_NAME={n}\n')
              out.write(f'DATASET_SLUG=nguynngthibo/{n}\n')
          PY
          echo STAGE7_PREPARE_PASS

      - name: Create private per-run Kaggle dataset
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          kaggle datasets create -p .stage7_dataset
          ready=0
          for i in $(seq 1 60); do
            if status=$(kaggle datasets status "$DATASET_SLUG" 2>&1); then
              echo "Dataset status [$i]: $status"
              if [[ "$status" == *ready* ]]; then ready=1; break; fi
              if [[ "$status" == *error* || "$status" == *failed* ]]; then exit 1; fi
            fi
            sleep 10
          done
          test "$ready" -eq 1 || { echo 'Kaggle dataset readiness timeout'; exit 1; }
          echo STAGE7_KAGGLE_DATASET_READY_PASS

      - name: Start Kaggle GPU train 3 architectures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .stage7_kernel stage7_logs
          python - <<'PY'
          import json, os
          from pathlib import Path
          src = Path('kaggle/stage7_train.py').read_text(encoding='utf-8')
          for marker, value in [('__STAGE7_DATASET_NAME__', os.environ['DATASET_NAME']),
                                ('__EXPECTED_RUN_ID__', os.environ['GITHUB_RUN_ID'])]:
              if src.count(marker) != 1:
                  raise SystemExit(f'Expected one marker {marker}')
              src = src.replace(marker, value)
          Path('.stage7_kernel/train.py').write_text(src, encoding='utf-8')
          metadata = {'id': os.environ['KERNEL_SLUG'], 'title': 'smart-parking-stage7-continuous-training',
                      'code_file': 'train.py', 'language': 'python', 'kernel_type': 'script',
                      'is_private': True, 'enable_gpu': True, 'enable_internet': False,
                      'machine_shape': 'NvidiaTeslaT4', 'dataset_sources': [os.environ['DATASET_SLUG']],
                      'kernel_sources': [], 'competition_sources': [], 'model_sources': []}
          Path('.stage7_kernel/kernel-metadata.json').write_text(json.dumps(metadata, indent=2), encoding='utf-8')
          PY
          python -m py_compile .stage7_kernel/train.py
          kaggle kernels push -p .stage7_kernel
          echo STAGE7_KAGGLE_PUSH_PASS

      - name: Await Kaggle GPU completion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage7_logs
          for i in $(seq 1 200); do
            status=$(kaggle kernels status "$KERNEL_SLUG" 2>&1) || {
              echo "$status"; echo ERROR > stage7_logs/status.txt; break;
            }
            echo "[$i] $status"
            if [[ "$status" == *COMPLETE* ]]; then echo COMPLETE > stage7_logs/status.txt; break; fi
            if [[ "$status" == *ERROR* || "$status" == *FAILED* || "$status" == *CANCEL* ]]; then
              echo ERROR > stage7_logs/status.txt; break
            fi
            sleep 15
          done
          test -e stage7_logs/status.txt || echo TIMEOUT > stage7_logs/status.txt
          cat stage7_logs/status.txt

      - name: Download Kaggle results
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 5); do
            if kaggle kernels output "$KERNEL_SLUG" -p stage7_logs; then break; fi
            sleep 8
          done
          test "$(cat stage7_logs/status.txt)" = COMPLETE
          test -s stage7_logs/stage7_train_report.json
          for model in mobilenetv3 resnet18 custom_cnn; do
            test -s "stage7_logs/stage7_candidate_${model}.pth"
          done
          echo STAGE7_THREE_CANDIDATES_RECEIVED_PASS

      - name: Run CPU evaluation gate and log to DagsHub MLflow
        shell: bash
        run: |
          set -euo pipefail
          python pipeline/stage7_gate.py --dataset .stage7_dataset \
            --kaggle-output stage7_logs --out stage7_output
          cat stage7_output/stage7_summary.md >> "$GITHUB_STEP_SUMMARY"
          echo STAGE7_WORKFLOW_PASS

      - name: Upload reports and candidates for manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-parking-stage7-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            stage7_output/stage7_report.json
            stage7_output/stage7_summary.md
            stage7_logs/stage7_train_report.json
            stage7_logs/stage7_candidate_mobilenetv3.pth
            stage7_logs/stage7_candidate_resnet18.pth
            stage7_logs/stage7_candidate_custom_cnn.pth
            stage7_logs/status.txt
            .stage7_dataset/manifest.json
          if-no-files-found: warn
          retention-days: 30
