
name: Smart Parking - Stage 7 Cloud Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # STEP 1: Check Python syntax
      - name: Check Stage 7 Python syntax
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile pipeline/stage7_prepare.py
          python -m py_compile pipeline/stage7_gate.py
          python -m py_compile pipeline/stage7_promote.py
          python -m py_compile kaggle/stage7_train.py

          echo "STAGE7_SYNTAX_PASS"

      # STEP 2: Install dependencies
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            "dvc[s3]==3.67.1" \
            "Pillow>=10,<12"

          python - <<'PY'
          import PIL
          import sys

          print("Python:", sys.version)
          print("Pillow:", PIL.__version__)
          print("STAGE7_DEPENDENCIES_PASS")
          PY

      # STEP 3: Configure DVC authentication
      - name: Configure DagsHub DVC authentication
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import subprocess

          token = os.environ.get("DAGSHUB_TOKEN", "").strip()

          if not token:
              raise SystemExit("Missing DAGSHUB_TOKEN")

          if any(ord(c) < 33 or ord(c) == 127 for c in token):
              raise SystemExit("Invalid DAGSHUB_TOKEN")

          for key in ("access_key_id", "secret_access_key"):
              subprocess.run(
                  [
                      "dvc",
                      "remote",
                      "modify",
                      "--local",
                      "origin",
                      key,
                      token,
                  ],
                  check=True,
              )

          print("STAGE7_DVC_AUTH_PASS")
          PY

      # STEP 4: Verify all three original checkpoints
      - name: Verify DVC checkpoint availability
        shell: bash
        run: |
          set -euo pipefail

          dvc pull \
            mobilenet_model/mobilenet_v3_small_best.pth.dvc \
            -r origin

          dvc pull \
            resnet_model/resnet18_best.pth.dvc \
            -r origin

          dvc pull \
            cnn_model/optimized_custom_cnn_best.pth.dvc \
            -r origin

          test -s mobilenet_model/mobilenet_v3_small_best.pth
          test -s resnet_model/resnet18_best.pth
          test -s cnn_model/optimized_custom_cnn_best.pth

          python - <<'PY'
          from pathlib import Path

          checkpoints = {
              "MobileNetV3":
                  "mobilenet_model/mobilenet_v3_small_best.pth",
              "ResNet18":
                  "resnet_model/resnet18_best.pth",
              "CustomCNN":
                  "cnn_model/optimized_custom_cnn_best.pth",
          }

          for model, filename in checkpoints.items():
              path = Path(filename)

              if not path.is_file():
                  raise SystemExit(f"Missing checkpoint: {model}")

              size_mb = path.stat().st_size / (1024 * 1024)

              print(f"{model}: {size_mb:.2f} MB")

          print("STAGE7_THREE_CHECKPOINTS_PASS")
          PY

      # STEP 5: Verify unapproved data is rejected
      - name: Verify approved data gate
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import subprocess
          import sys
          import tempfile

          with tempfile.TemporaryDirectory() as tmp:
              result = subprocess.run(
                  [
                      sys.executable,
                      "pipeline/stage7_prepare.py",
                      "--approved-dir",
                      tmp,
                  ],
                  capture_output=True,
                  text=True,
              )

          print("Return code:", result.returncode)
          print("STDOUT:")
          print(result.stdout)
          print("STDERR:")
          print(result.stderr)

          if result.returncode == 0:
              raise SystemExit(
                  "FAIL: unapproved data was accepted"
              )

          output = result.stdout + result.stderr

          if "Missing human-reviewed manifest" not in output:
              raise SystemExit(
                  "FAIL: unexpected preparation error"
              )

          print("STAGE7_UNAPPROVED_DATA_BLOCKED_PASS")
          PY

      # STEP 6: Verify Production cannot change without approval
      - name: Verify Production protection
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import subprocess
          import sys

          result = subprocess.run(
              [
                  sys.executable,
                  "pipeline/stage7_promote.py",
              ],
              capture_output=True,
              text=True,
          )

          print("Return code:", result.returncode)
          print("STDOUT:")
          print(result.stdout)
          print("STDERR:")
          print(result.stderr)

          if result.returncode == 0:
              raise SystemExit(
                  "FAIL: promotion without approval succeeded"
              )

          output = result.stdout + result.stderr

          if "--confirm-production required" not in output:
              raise SystemExit(
                  "FAIL: unexpected promotion response"
              )

          print("STAGE7_PRODUCTION_PROTECTION_PASS")
          PY

      # STEP 7: Final verification
      - name: Final smoke-test result
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "SMART PARKING MLOPS - STAGE 7 SMOKE TEST"
          echo "========================================"
          echo "STAGE7_SYNTAX_PASS"
          echo "STAGE7_DEPENDENCIES_PASS"
          echo "STAGE7_DVC_AUTH_PASS"
          echo "STAGE7_THREE_CHECKPOINTS_PASS"
          echo "STAGE7_UNAPPROVED_DATA_BLOCKED_PASS"
          echo "STAGE7_PRODUCTION_PROTECTION_PASS"
          echo "STAGE7_CLOUD_SMOKE_TEST_PASS"
          echo "PRODUCTION_UNCHANGED"
