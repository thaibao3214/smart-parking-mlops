
name: Smart Parking - Stage 7 Cloud Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # STEP 1: Checkout
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # STEP 2: Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # STEP 3: Syntax
      - name: Check Stage 7 Python syntax
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile pipeline/stage7_prepare.py
          python -m py_compile pipeline/stage7_gate.py
          python -m py_compile pipeline/stage7_promote.py
          python -m py_compile kaggle/stage7_train.py

          echo "STAGE7_SYNTAX_PASS"

      # STEP 4: Dependencies
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            "dvc[s3]==3.67.1" \
            "Pillow>=10,<12"

          python - <<'PY'
          import PIL
          import sys

          print("Python:", sys.version)
          print("Pillow:", PIL.__version__)
          print("STAGE7_DEPENDENCIES_PASS")
          PY

      # STEP 5: Configure DVC authentication
      - name: Configure DagsHub DVC authentication
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import subprocess

          token = os.environ.get("DAGSHUB_TOKEN", "").strip()

          if not token:
              raise SystemExit("Missing DAGSHUB_TOKEN")

          if any(ord(c) < 33 or ord(c) == 127 for c in token):
              raise SystemExit("Invalid DAGSHUB_TOKEN")

          for key in ("access_key_id", "secret_access_key"):
              subprocess.run(
                  [
                      "dvc",
                      "remote",
                      "modify",
                      "--local",
                      "origin",
                      key,
                      token,
                  ],
                  check=True,
              )

          print("STAGE7_DVC_AUTH_PASS")
          PY

      # STEP 6: Pull 3 checkpoints
      - name: Verify DVC checkpoint availability
        shell: bash
        run: |
          set -euo pipefail

          dvc pull \
            mobilenet_model/mobilenet_v3_small_best.pth.dvc \
            -r origin

          dvc pull \
            resnet_model/resnet18_best.pth.dvc \
            -r origin

          dvc pull \
            cnn_model/optimized_custom_cnn_best.pth.dvc \
            -r origin

          test -s mobilenet_model/mobilenet_v3_small_best.pth
          test -s resnet_model/resnet18_best.pth
          test -s cnn_model/optimized_custom_cnn_best.pth

          python - <<'PY'
          from pathlib import Path

          checkpoints = {
              "MobileNetV3":
                  "mobilenet_model/mobilenet_v3_small_best.pth",
              "ResNet18":
                  "resnet_model/resnet18_best.pth",
              "CustomCNN":
                  "cnn_model/optimized_custom_cnn_best.pth",
          }

          for model, filename in checkpoints.items():
              path = Path(filename)

              if not path.is_file():
                  raise SystemExit(
                      f"Missing checkpoint: {model}"
                  )

              size_mb = (
                  path.stat().st_size / (1024 * 1024)
              )

              print(f"{model}: {size_mb:.2f} MB")

          print("STAGE7_THREE_CHECKPOINTS_PASS")
          PY

      # STEP 7: Approved data gate
      - name: Verify approved data gate
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import subprocess
          import sys
          import tempfile

          with tempfile.TemporaryDirectory() as tmp:
              result = subprocess.run(
                  [
                      sys.executable,
                      "pipeline/stage7_prepare.py",
                      "--approved-dir",
                      tmp,
                  ],
                  capture_output=True,
                  text=True,
              )

          print("Return code:", result.returncode)
          print("STDOUT:")
          print(result.stdout)
          print("STDERR:")
          print(result.stderr)

          if result.returncode == 0:
              raise SystemExit(
                  "FAIL: unapproved data was accepted"
              )

          output = result.stdout + result.stderr

          if "Missing human-reviewed manifest" not in output:
              raise SystemExit(
                  "FAIL: unexpected preparation error"
              )

          print("STAGE7_UNAPPROVED_DATA_BLOCKED_PASS")
          PY

      # STEP 8: Production protection
      # Static inspection: no torch or MLflow connection needed.
      - name: Verify Production protection
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("pipeline/stage7_promote.py")

          if not path.is_file():
              raise SystemExit(
                  "FAIL: missing stage7_promote.py"
              )

          source = path.read_text(encoding="utf-8")

          # Confirm valid Python syntax.
          ast.parse(source)

          required = {
              "approval flag": "--confirm-production",
              "refusal message": "--confirm-production required",
              "production alias": "production",
              "rollback option": "--rollback-version",
              "explicit promotion approval": "--approve-sha256",
              "run ID approval": "--approve-run-id",
          }

          for name, marker in required.items():
              if marker not in source:
                  raise SystemExit(
                      f"FAIL: missing {name}: {marker}"
                  )

              print(f"PASS: {name}")

          print("STAGE7_PRODUCTION_PROTECTION_STATIC_PASS")
          print("PRODUCTION_UNCHANGED")
          PY

      # STEP 9: Final result
      - name: Final smoke-test result
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "SMART PARKING MLOPS - STAGE 7 SMOKE TEST"
          echo "========================================"

          echo "STAGE7_SYNTAX_PASS"
          echo "STAGE7_DEPENDENCIES_PASS"
          echo "STAGE7_DVC_AUTH_PASS"
          echo "STAGE7_THREE_CHECKPOINTS_PASS"
          echo "STAGE7_UNAPPROVED_DATA_BLOCKED_PASS"
          echo "STAGE7_PRODUCTION_PROTECTION_STATIC_PASS"
          echo "STAGE7_CLOUD_SMOKE_TEST_PASS"
          echo "PRODUCTION_UNCHANGED"
